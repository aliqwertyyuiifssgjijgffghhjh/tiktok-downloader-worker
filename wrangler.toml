name = "tiktok-downloader-api"
main = "src/index.js"
compatibility_date = "2026-11-08"
workers_dev = true

[vars]
# Set this to your exact website origin after deployment, e.g. https://example.com
ALLOWED_ORIGIN = "http://localhost:8787"

# Set SAVEAPI_KEY as a Worker secret; never put it in this file.

# Approximate abuse protection: 10 download requests per client IP per 60 seconds.
# Choose a positive integer namespace_id that is unique in your Cloudflare account.
[[ratelimits]]
name = "DOWNLOAD_LIMITER"
namespace_id = "875321"

  [ratelimits.simple]
  limit = 10
  period = 60
