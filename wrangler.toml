name = "tiktok-downloader-api"
main = "src/index.js"
compatibility_date = "2026-11-08"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "tiktok-api-admin"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "http://localhost:8787"

[[ratelimits]]
name = "DOWNLOAD_LIMITER"
namespace_id = "875321"

  [ratelimits.simple]
  limit = 10
  period = 60
